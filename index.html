<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mahid Scanner</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #0b0f14;

    color: white;
}

.container {

    width: 100%;

    max-width: 1600px;

    margin: auto;

    padding: 15px;
}

h1 {

    margin: 0;

    font-size: 26px;
}

.subtitle {

    color: #9aa4b2;

    margin: 5px 0 15px;
}

.controls {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 15px;
}

button {

    padding: 11px 18px;

    border: none;

    border-radius: 8px;

    background: #1d7cff;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {

    opacity: .5;

    cursor: not-allowed;
}

.status {

    margin: 10px 0;

    color: #9aa4b2;
}

.table-wrap {

    width: 100%;

    overflow-x: auto;

    border: 1px solid #252d38;

    border-radius: 10px;
}

table {

    width: 100%;

    min-width: 1200px;

    border-collapse: collapse;
}

th,
td {

    padding: 12px 10px;

    border-bottom: 1px solid #252d38;

    text-align: center;

    white-space: nowrap;
}

th {

    background: #151b23;

    color: #dce3ec;

    position: sticky;

    top: 0;
}

.stock {

    font-weight: bold;

    font-size: 15px;
}

.green {

    color: #35d07f;

    font-weight: bold;
}

.red {

    color: #ff5c69;

    font-weight: bold;
}

.yellow {

    color: #ffd166;

    font-weight: bold;
}

.blue {

    color: #55aaff;

    font-weight: bold;
}

.reason {

    white-space: normal;

    min-width: 300px;

    max-width: 450px;

    text-align: left;

    color: #c9d2de;
}

.badge {

    padding: 5px 9px;

    border-radius: 6px;

    background: #151b23;
}

.info {

    display: flex;

    gap: 20px;

    flex-wrap: wrap;

    margin: 15px 0;

    color: #c9d2de;
}

.error {

    color: #ff5c69;

    font-weight: bold;
}

@media(max-width:600px) {

    .container {

        padding: 10px;
    }

    h1 {

        font-size: 22px;
    }

    button {

        width: 100%;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>📊 Mahid Scanner</h1>


<div class="subtitle">

NSE Next-Session Movement Scanner

</div>


<div class="controls">

<button
    id="scanBtn"
    onclick="scanMarket()"
>
    🔍 Scan Full NSE
</button>

</div>


<div id="status" class="status">

Ready to scan

</div>


<div class="info">

<div>
    NSE Scanned:
    <strong id="universe">—</strong>
</div>

<div>
    Candidates:
    <strong id="candidates">—</strong>
</div>

<div>
    Final:
    <strong id="finalCount">—</strong>
</div>

</div>


<div class="table-wrap">


<table>


<thead>

<tr>

<th>Rank</th>

<th>Stock</th>

<th>Price</th>

<th>Direction</th>

<th>Score</th>

<th>Day Change</th>

<th>Volume Ratio</th>

<th>ATR %</th>

<th>Support</th>

<th>Resistance</th>

<th>5M Support</th>

<th>5M Resistance</th>

<th>Confirmation</th>

<th>Reason</th>

</tr>

</thead>


<tbody id="stockTable">

</tbody>


</table>


</div>


</div>


<script>


const API_URL =
    "https://mahid-stock-scanner-api.onrender.com";


let scanning = false;


function formatPrice(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }

    return "₹" +
        Number(value).toFixed(2);
}


function formatNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }

    return Number(value)
        .toLocaleString("en-IN");
}


function directionClass(direction) {

    if (direction === "UP") {

        return "green";

    }

    if (direction === "DOWN") {

        return "red";

    }

    return "yellow";
}


async function scanMarket() {


    if (scanning) {

        return;

    }


    scanning = true;


    const button =
        document.getElementById(
            "scanBtn"
        );


    const table =
        document.getElementById(
            "stockTable"
        );


    const status =
        document.getElementById(
            "status"
        );


    button.disabled = true;


    button.innerText =
        "⏳ Scanning NSE...";


    table.innerHTML = `

        <tr>

            <td colspan="14">

                Scanning full NSE universe...

                <br><br>

                Please wait.

            </td>

        </tr>

    `;


    status.innerText =
        "Scanning NSE stocks. This can take some time...";


    try {


        const response =
            await fetch(
                API_URL +
                "/api/scan"
            );


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                data.message ||
                "Scanner error"
            );

        }


        document.getElementById(
            "universe"
        ).innerText =
            formatNumber(
                data.universe_scanned
            );


        document.getElementById(
            "candidates"
        ).innerText =
            formatNumber(
                data.technical_candidates
            );


        document.getElementById(
            "finalCount"
        ).innerText =
            formatNumber(
                data.final_count
            );


        table.innerHTML = "";


        if (
            !data.stocks ||
            data.stocks.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="14"
                        class="yellow"
                    >

                        No strong next-session
                        setup found.

                    </td>

                </tr>

            `;

            status.innerText =
                "Scan complete • No strong setup";

            return;

        }


        data.stocks.forEach(
            (stock, index) => {


                const row =
                    document.createElement(
                        "tr"
                    );


                const reason =
                    stock.reasons
                    ? stock.reasons.join(
                        " • "
                    )
                    : "—";


                row.innerHTML = `

                    <td>
                        <strong>
                            #${index + 1}
                        </strong>
                    </td>


                    <td class="stock">
                        ${stock.symbol}
                    </td>


                    <td>
                        ${formatPrice(
                            stock.price
                        )}
                    </td>


                    <td class="${directionClass(
                        stock.direction
                    )}">
                        ${stock.direction}
                    </td>


                    <td class="blue">
                        ${stock.score}
                    </td>


                    <td class="${
                        Number(
                            stock.change_percent
                        ) >= 0
                        ? "green"
                        : "red"
                    }">

                        ${
                            Number(
                                stock.change_percent
                            ).toFixed(2)
                        }%

                    </td>


                    <td class="${
                        Number(
                            stock.volume_ratio
                        ) >= 1.5
                        ? "green"
                        : "yellow"
                    }">

                        ${
                            Number(
                                stock.volume_ratio
                            ).toFixed(2)
                        }x

                    </td>


                    <td>
                        ${Number(
                            stock.atr_percent
                        ).toFixed(2)}%
                    </td>


                    <td>
                        ${formatPrice(
                            stock.support
                        )}
                    </td>


                    <td>
                        ${formatPrice(
                            stock.resistance
                        )}
                    </td>


                    <td>
                        ${formatPrice(
                            stock.support_5m
                        )}
                    </td>


                    <td>
                        ${formatPrice(
                            stock.resistance_5m
                        )}
                    </td>


                    <td class="${
                        stock.confirmation &&
                        stock.confirmation
                        .includes("confirmation")
                        ? "green"
                        : "yellow"
                    }">

                        ${
                            stock.confirmation
                            || "Pending"
                        }

                    </td>


                    <td class="reason">

                        ${reason}

                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );


        status.innerText =
            "✅ Scan complete • " +
            data.final_count +
            " strong candidate(s) found";


    } catch (error) {


        table.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="error"
                >

                    Scanner connection error:

                    ${error.message}

                </td>

            </tr>

        `;


        status.innerText =
            "Scanner error";


    } finally {


        button.disabled = false;


        button.innerText =
            "🔍 Scan Full NSE";


        scanning = false;

    }

}

</script>


</body>

</html>
