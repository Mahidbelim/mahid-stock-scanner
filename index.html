```html
<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahid Stock Scanner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#08111f;
    color:white;
}

header{
    background:#101c30;
    padding:20px;
    border-bottom:1px solid #263752;
}

.logo{
    font-size:26px;

.subtitle{
    color:#9aa8bd;
    margin-top:6px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

select,
input,
button{
    padding:12px;

    border:1px solid #31415d;

    background:#0099cc;

    opacity:0.6;

    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#111d31;
    border:1px solid #263752;
    border-radius:12px;

.card-title{
    color:#9aa8bd;

}

.card-value{
    font-size:25px;

}

.blue{
    color:#00d9ff;
}

.green{
    color:#22d69a;
}

.red{
    color:#ff6577;

    color:#ffd166;

    background:#111d31;

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;

    padding:14px;

    border-bottom:1px solid #263752;

<body>

<header>

<div class="logo">
📊 Mahid Stock Scanner
</div>

<div class="subtitle">
NSE • Live Market Data
</div>

</header>


<div class="container">


<div class="controls">

<select id="market">

<option>NSE</option>
<option>BSE</option>

</select>


<select id="timeframe">

<option>5 Minute</option>
<option>15 Minute</option>
<option>1 Hour</option>
<option>1 Day</option>

</select>


<input
type="text"
id="search"
placeholder="Search stock..."
>


<button
id="scanButton"
onclick="scanStocks()"
>

🔍 Scan Stocks

</button>

</div>


<div class="cards">


<div class="card">

<div class="card-title">
Stocks Scanned
</div>

<div
class="card-value blue"
id="stocksCount"
>
0
</div>

</div>


<div class="card">

<div class="card-title">
Live Data
</div>

<div
class="card-value green"
id="liveCount"
>
0
</div>

</div>


<div class="card">

<div class="card-title">
API Status
</div>

<div
class="card-value green"
id="apiStatus"
>
READY
</div>

</div>


<div class="card">

<div class="card-title">
Market
</div>

<div
class="card-value blue"
id="marketName"
>
NSE
</div>

</div>


</div>


<div
class="status"
id="status"
>

Scanner ready — Click Scan Stocks.

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>Stock</th>
<th>Price</th>
<th>Open</th>
<th>High</th>
<th>Low</th>
<th>Volume</th>
<th>Change</th>
<th>Status</th>

</tr>

</thead>


<tbody id="stockTable">

<tr>

<td>RELIANCE</td>
<td>—</td>
<td>—</td>
<td>—</td>
<td>—</td>
<td>—</td>
<td>—</td>

<td>

<span class="badge waiting">
Waiting
</span>

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script>


let scanning = false;


async function scanStocks(){


    if(scanning){

        return;

    }


    scanning = true;


    const button =
        document.getElementById("scanButton");


    const table =
        document.getElementById("stockTable");


    const status =
        document.getElementById("status");


    const stocksCount =
        document.getElementById("stocksCount");


    const liveCount =
        document.getElementById("liveCount");


    const apiStatus =
        document.getElementById("apiStatus");


    const marketName =
        document.getElementById("marketName");


    const market =
        document.getElementById("market").value;


    marketName.innerText =
        market;


    button.disabled = true;


    button.innerText =
        "⏳ Scanning...";


    status.innerText =
        "🔄 Live market data loading...";


    apiStatus.innerText =
        "LOADING";


    table.innerHTML = "";


    const stocks = [

        "RELIANCE",
        "TCS",
        "INFY",
        "HDFCBANK",
        "ICICIBANK",
        "SBIN",
        "BHARTIARTL",
        "ITC",
        "LT",
        "AXISBANK",
        "KOTAKBANK",
        "HINDUNILVR"

    ];


    let successCount = 0;


    for(const symbol of stocks){


        try{


            const response =
                await fetch(
                    "https://mahid-stock-scanner-api.onrender.com/api/stock/"
                    + symbol
                );


            if(!response.ok){

                console.log(
                    symbol,
                    response.status
                );

                continue;

            }


            const data =
                await response.json();


            console.log(
                symbol,
                data
            );


            if(data.status === "success"){


                successCount++;


                const row =
                    document.createElement("tr");


                row.dataset.symbol =
                    symbol;


                row.innerHTML = `


<td>

<strong>
${data.symbol ?? symbol}
</strong>

</td>


<td>

₹${data.price ?? "—"}

</td>


<td>

₹${data.open ?? "—"}

</td>


<td>

₹${data.high ?? "—"}

</td>


<td>

₹${data.low ?? "—"}

</td>


<td>

${data.volume ?? "—"}

</td>


<td class="${
    Number(data.change) >= 0
    ? "green"
    : "red"
}">

${data.change ?? "—"}

(${data.change_percent ?? "—"}%)

</td>


<td>

<span class="badge live">

LIVE

</span>

</td>


`;


                table.appendChild(row);

            }


        }


        catch(error){


            console.log(
                "API Error:",
                symbol,
                error
            );


        }


    }


    stocksCount.innerText =
        successCount;


    liveCount.innerText =
        successCount;


    if(successCount > 0){


        apiStatus.innerText =
            "CONNECTED";


        status.innerText =
            "✅ Live market data connected successfully.";


    }


    else{


        apiStatus.innerText =
            "ERROR";


        status.innerText =
            "❌ Market data load nahi hua.";

    }


    button.disabled = false;


    button.innerText =
        "🔍 Scan Stocks";


    scanning = false;

}


/* SEARCH */


document
.getElementById("search")
.addEventListener(
    "input",
    function(){


        const value =
            this.value.toUpperCase();


        document
        .querySelectorAll(
            "#stockTable tr"
        )
        .forEach(
            function(row){


                if(row.cells.length > 0){


                    const stock =
                        row.cells[0]
                        .innerText
                        .toUpperCase();


                    row.style.display =
                        stock.includes(value)
                        ? ""
                        : "none";


                }


            }
        );


    }
);


</script>

</body>

</html>
