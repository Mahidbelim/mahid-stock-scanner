<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahid Scanner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

.container {
    width: 100%;
    max-width: 1600px;
    margin: auto;
    padding: 15px;
}

h1 {
    margin: 0;
    font-size: 26px;
}

.subtitle {
    color: #9aa4b2;
    margin: 5px 0 15px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

button {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    background: #1d7cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin: 12px 0;
    color: #9aa4b2;
}

.info {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    margin: 15px 0;
    color: #c9d2de;
}

.info-box {
    background: #111720;
    border: 1px solid #252d38;
    padding: 10px 14px;
    border-radius: 8px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #252d38;
    border-radius: 10px;
}

table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
}

th,
td {
    padding: 12px 10px;
    border-bottom: 1px solid #252d38;
    text-align: center;
    white-space: nowrap;
}

th {
    background: #151b23;
    color: #dce3ec;
    position: sticky;
    top: 0;
}

.stock {
    font-weight: bold;
    font-size: 15px;
}

.green {
    color: #35d07f;
    font-weight: bold;
}

.red {
    color: #ff5c69;
    font-weight: bold;
}

.yellow {
    color: #ffd166;
    font-weight: bold;
}

.blue {
    color: #55aaff;
    font-weight: bold;
}

.reason {
    white-space: normal;
    min-width: 300px;
    max-width: 450px;
    text-align: left;
    color: #c9d2de;
}

.breakout {
    color: #35d07f;
    font-weight: bold;
}

.breakdown {
    color: #ff5c69;
    font-weight: bold;
}

.loading {
    padding: 30px;
    color: #ffd166;
}

.error {
    color: #ff5c69;
    font-weight: bold;
    padding: 20px;
}

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 22px;
    }

    button {
        width: 100%;
    }

    .info-box {
        width: 100%;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>📊 Mahid Scanner</h1>

    <div class="subtitle">
        NSE Next-Session Movement Scanner
    </div>

    <div class="controls">

        <button
            id="scanBtn"
            onclick="startScan()"
        >
            🔍 Scan Full NSE
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Ready to scan
    </div>

    <div class="info">

        <div class="info-box">
            Market:
            <strong>NSE</strong>
        </div>

        <div class="info-box">
            Selected:
            <strong id="finalCount">—</strong>
        </div>

        <div class="info-box">
            Updated:
            <strong id="updated">—</strong>
        </div>

    </div>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>Rank</th>
                    <th>Stock</th>
                    <th>Price</th>
                    <th>Setup</th>
                    <th>Total Score</th>
                    <th>5D Change</th>
                    <th>Volume</th>
                    <th>ATR %</th>
                    <th>Support</th>
                    <th>Resistance</th>
                    <th>5M Support</th>
                    <th>5M Resistance</th>
                    <th>5M Volume</th>
                    <th>Reason</th>
                </tr>

            </thead>

            <tbody id="stockTable">

                <tr>
                    <td colspan="14">
                        Scan Full NSE to find strong setups.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

const API_URL =
    "https://mahid-stock-scanner-api.onrender.com";

let polling = false;
let timer = null;


/* =========================
   FORMAT PRICE
========================= */

function price(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    return "₹" + Number(value).toFixed(2);
}


/* =========================
   FORMAT NUMBER
========================= */

function number(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    return Number(value).toLocaleString("en-IN");
}


/* =========================
   START SCAN
========================= */

async function startScan() {

    if (polling) {
        return;
    }

    polling = true;

    const button =
        document.getElementById("scanBtn");

    const table =
        document.getElementById("stockTable");

    const status =
        document.getElementById("status");

    button.disabled = true;

    button.innerText =
        "⏳ Starting...";

    table.innerHTML = `
        <tr>
            <td colspan="14" class="loading">
                🔍 NSE scan started...
                <br><br>
                Please wait.
            </td>
        </tr>
    `;

    status.innerText =
        "Scanning NSE stocks...";

    try {

        const response =
            await fetch(
                API_URL + "/api/scan"
            );

        const data =
            await response.json();

        if (
            data.status !== "scanning"
        ) {

            throw new Error(
                data.message ||
                "Unable to start scanner"
            );

        }

        status.innerText =
            "🔄 NSE scan running...";

        button.innerText =
            "⏳ Scanning...";

        /*
            Check status every 5 seconds
        */

        checkStatus();

        timer =
            setInterval(
                checkStatus,
                5000
            );

    } catch (error) {

        showError(error.message);

        polling = false;

        button.disabled = false;

        button.innerText =
            "🔍 Scan Full NSE";
    }
}


/* =========================
   CHECK SCAN STATUS
========================= */

async function checkStatus() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/scan/status"
            );

        const data =
            await response.json();

        const status =
            document.getElementById(
                "status"
            );

        const button =
            document.getElementById(
                "scanBtn"
            );

        /*
            SCANNING
        */

        if (
            data.status ===
            "scanning"
        ) {

            status.innerText =
                "🔄 " +
                data.message;

            return;
        }


        /*
            COMPLETE
        */

        if (
            data.status ===
            "complete"
        ) {

            clearInterval(timer);

            polling = false;

            button.disabled = false;

            button.innerText =
                "🔍 Scan Full NSE";

            showResults(data);

            return;
        }


        /*
            ERROR
        */

        if (
            data.status ===
            "error"
        ) {

            clearInterval(timer);

            polling = false;

            button.disabled = false;

            button.innerText =
                "🔍 Scan Full NSE";

            showError(
                data.message ||
                "Scanner error"
            );

            return;
        }

    } catch (error) {

        console.log(
            "Status check:",
            error
        );
    }
}


/* =========================
   SHOW RESULTS
========================= */

function showResults(data) {

    const table =
        document.getElementById(
            "stockTable"
        );

    const status =
        document.getElementById(
            "status"
        );

    const finalCount =
        document.getElementById(
            "finalCount"
        );

    const updated =
        document.getElementById(
            "updated"
        );


    const results =
        data.results || [];


    finalCount.innerText =
        results.length;


    updated.innerText =
        data.updated || "—";


    if (
        results.length === 0
    ) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="14"
                    class="yellow"
                >
                    No strong setup found.
                </td>
            </tr>
        `;

        status.innerText =
            "Scan complete • No strong setup";

        return;
    }


    table.innerHTML = "";


    results.forEach(
        (stock, index) => {

            const row =
                document.createElement("tr");


            let setupClass =
                "yellow";


            if (
                stock.setup ===
                "BREAKOUT"
            ) {
                setupClass =
                    "breakout";
            }


            if (
                stock.setup ===
                "BREAKDOWN"
            ) {
                setupClass =
                    "breakdown";
            }


            const changeClass =
                Number(
                    stock.change_5d
                ) >= 0
                ? "green"
                : "red";


            const volumeClass =
                Number(
                    stock.volume_ratio_5m
                ) >= 1.5
                ? "green"
                : "yellow";


            row.innerHTML = `

                <td>
                    <strong>
                        #${index + 1}
                    </strong>
                </td>


                <td class="stock">
                    ${stock.symbol}
                </td>


                <td>
                    ${price(
                        stock.price_5m ??
                        stock.price
                    )}
                </td>


                <td class="${setupClass}">
                    ${stock.setup || "WATCH"}
                </td>


                <td class="blue">
                    ${stock.total_score ?? "—"}
                </td>


                <td class="${changeClass}">
                    ${
                        stock.change_5d !==
                        undefined
                        ? Number(
                            stock.change_5d
                          ).toFixed(2) + "%"
                        : "—"
                    }
                </td>


                <td class="${volumeClass}">
                    ${
                        stock.volume_ratio_5m !==
                        undefined
                        ? Number(
                            stock.volume_ratio_5m
                          ).toFixed(2) + "x"
                        : "—"
                    }
                </td>


                <td>
                    ${
                        stock.atr_percent !==
                        undefined
                        ? Number(
                            stock.atr_percent
                          ).toFixed(2) + "%"
                        : "—"
                    }
                </td>


                <td>
                    ${price(
                        stock.support
                    )}
                </td>


                <td>
                    ${price(
                        stock.resistance
                    )}
                </td>


                <td>
                    ${price(
                        stock.support_5m
                    )}
                </td>


                <td>
                    ${price(
                        stock.resistance_5m
                    )}
                </td>


                <td class="${
                    Number(
                        stock.volume_ratio_5m
                    ) >= 1.5
                    ? "green"
                    : "yellow"
                }">

                    ${
                        stock.volume_ratio_5m !==
                        undefined
                        ? Number(
                            stock.volume_ratio_5m
                          ).toFixed(2) + "x"
                        : "—"
                    }

                </td>


                <td class="reason">
                    ${stock.reason || "—"}
                </td>

            `;


            table.appendChild(row);

        }
    );


    status.innerText =
        "✅ Scan complete • " +
        results.length +
        " strong stock(s) found";
}


/* =========================
   ERROR
========================= */

function showError(message) {

    const table =
        document.getElementById(
            "stockTable"
        );

    const status =
        document.getElementById(
            "status"
        );

    table.innerHTML = `

        <tr>

            <td
                colspan="14"
                class="error"
            >

                Scanner error:
                ${message}

            </td>

        </tr>

    `;

    status.innerText =
        "❌ Scanner error";
}

</script>

</body>

</html>
