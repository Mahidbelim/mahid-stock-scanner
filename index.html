<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahid Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 1600px;
    margin: auto;
    padding: 15px;
}

h1 {
    margin: 0 0 5px 0;
    font-size: 26px;
}

.subtitle {
    color: #9aa4b2;
    margin-bottom: 15px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

select,
input,
button {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #303844;
    background: #151b23;
    color: white;
    font-size: 14px;
}

input {
    min-width: 180px;
}

button {
    background: #1d7cff;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status {
    margin: 10px 0;
    color: #9aa4b2;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #252d38;
    border-radius: 10px;
}

table {
    width: 100%;
    min-width: 1350px;
    border-collapse: collapse;
}

th,
td {
    padding: 11px 10px;
    border-bottom: 1px solid #252d38;
    text-align: center;
    white-space: nowrap;
}

th {
    background: #151b23;
    color: #dce3ec;
    font-size: 13px;
    position: sticky;
    top: 0;
}

td {
    font-size: 13px;
}

.stock {
    font-weight: bold;
}

.green {
    color: #35d07f;
    font-weight: bold;
}

.red {
    color: #ff5c69;
    font-weight: bold;
}

.yellow {
    color: #ffd166;
    font-weight: bold;
}

.blue {
    color: #55aaff;
    font-weight: bold;
}

.reason {
    white-space: normal;
    min-width: 250px;
    max-width: 320px;
    color: #c9d2de;
}

.live {
    color: #35d07f;
    font-weight: bold;
}

.error {
    color: #ff5c69;
}

@media (max-width: 600px) {
    .container {
        padding: 10px;
    }

    h1 {
        font-size: 22px;
    }

    .controls {
        flex-direction: column;
    }

    select,
    input,
    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📊 Mahid Scanner</h1>

    <div class="subtitle">
        NSE Stock Scanner • Support / Resistance • Volume • Zone • Signals
    </div>

    <div class="controls">

        <select id="exchange">
            <option value="NSE">NSE</option>
            <option value="BSE">BSE</option>
        </select>

        <select id="timeframe">
            <option value="5m">5 Minute</option>
            <option value="15m">15 Minute</option>
            <option value="1d">Daily</option>
        </select>

        <input
            type="text"
            id="search"
            placeholder="Search stock..."
        >

        <button id="scanBtn" onclick="scanStocks()">
            🔍 Scan Stocks
        </button>

    </div>

    <div id="status" class="status">
        Ready to scan
    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>

                    <th>Stock</th>

                    <th>Price</th>

                    <th>Day Support</th>

                    <th>Day Resistance</th>

                    <th>5M Support</th>

                    <th>5M Resistance</th>

                    <th>Zone</th>

                    <th>Volume</th>

                    <th>Avg Volume</th>

                    <th>Vol Ratio</th>

                    <th>Candle</th>

                    <th>Signal</th>

                    <th>Signal Reason</th>

                    <th>Change</th>

                    <th>Status</th>

                </tr>
            </thead>

            <tbody id="stockTable">

            </tbody>

        </table>

    </div>

</div>


<script>

const API_URL =
    "https://mahid-stock-scanner-api.onrender.com/api/stock/";

const stocks = [
    "RELIANCE",
    "TCS",
    "INFY",
    "HDFCBANK",
    "ICICIBANK",
    "SBIN",
    "BHARTIARTL",
    "ITC",
    "LT",
    "AXISBANK",
    "KOTAKBANK",
    "HINDUNILVR"
];

let scanning = false;


// --------------------------------------------------
// FORMAT NUMBER
// --------------------------------------------------

function formatNumber(value) {

    if (value === null || value === undefined) {
        return "—";
    }

    return Number(value).toLocaleString("en-IN");
}


// --------------------------------------------------
// FORMAT PRICE
// --------------------------------------------------

function formatPrice(value) {

    if (value === null || value === undefined) {
        return "₹—";
    }

    return "₹" + Number(value).toFixed(2);
}


// --------------------------------------------------
// SIGNAL CLASS
// --------------------------------------------------

function signalClass(signal) {

    if (signal === "BUY AREA") {
        return "green";
    }

    if (signal === "SELL AREA") {
        return "red";
    }

    return "yellow";
}


// --------------------------------------------------
// ZONE CLASS
// --------------------------------------------------

function zoneClass(zone) {

    if (zone === "Discount Zone") {
        return "green";
    }

    if (zone === "Premium Zone") {
        return "red";
    }

    return "yellow";
}


// --------------------------------------------------
// CANDLE CLASS
// --------------------------------------------------

function candleClass(candle) {

    if (candle === "BULLISH") {
        return "green";
    }

    if (candle === "BEARISH") {
        return "red";
    }

    return "yellow";
}


// --------------------------------------------------
// SCAN STOCKS
// --------------------------------------------------

async function scanStocks() {

    if (scanning) {
        return;
    }

    scanning = true;

    const button =
        document.getElementById("scanBtn");

    const table =
        document.getElementById("stockTable");

    const status =
        document.getElementById("status");

    button.disabled = true;

    button.innerText = "Scanning...";

    table.innerHTML = "";

    status.innerText =
        "Scanning 12 stocks...";


    for (const symbol of stocks) {

        // Create loading row

        const row =
            document.createElement("tr");

        row.id =
            "row-" + symbol;

        row.innerHTML = `

            <td class="stock">
                ${symbol}
            </td>

            <td>Loading...</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>—</td>

            <td>WAIT</td>

            <td class="reason">
                Loading...
            </td>

            <td>—</td>

            <td>Loading</td>

        `;

        table.appendChild(row);


        try {

            const response =
                await fetch(
                    API_URL +
                    encodeURIComponent(symbol)
                );


            const data =
                await response.json();


            if (data.status !== "success") {

                row.innerHTML = `

                    <td class="stock">
                        ${symbol}
                    </td>

                    <td colspan="13"
                        class="error">
                        ${data.message || "Data error"}
                    </td>

                    <td class="error">
                        ERROR
                    </td>

                `;

                continue;
            }


            const signal =
                data.signal || "WAIT";

            const zone =
                data.zone || "—";

            const candle =
                data.candle || "—";


            row.innerHTML = `

                <td class="stock">
                    ${data.symbol || symbol}
                </td>


                <td>
                    ${formatPrice(data.price)}
                </td>


                <td>
                    ${formatPrice(data.major_support)}
                </td>


                <td>
                    ${formatPrice(data.major_resistance)}
                </td>


                <td>
                    ${formatPrice(data.support_5m)}
                </td>


                <td>
                    ${formatPrice(data.resistance_5m)}
                </td>


                <td class="${zoneClass(zone)}">
                    ${zone}
                </td>


                <td>
                    ${formatNumber(data.volume)}
                </td>


                <td>
                    ${formatNumber(data.average_volume)}
                </td>


                <td class="${
                    Number(data.volume_ratio) >= 1.5
                    ? "green"
                    : "yellow"
                }">
                    ${
                        data.volume_ratio !== null &&
                        data.volume_ratio !== undefined
                        ? Number(data.volume_ratio).toFixed(2) + "x"
                        : "—"
                    }
                </td>


                <td class="${candleClass(candle)}">
                    ${candle}
                </td>


                <td class="${signalClass(signal)}">
                    ${signal}
                </td>


                <td class="reason">
                    ${data.signal_reason || "No confirmed setup"}
                </td>


                <td class="${
                    Number(data.change) >= 0
                    ? "green"
                    : "red"
                }">

                    ${
                        data.change !== null &&
                        data.change !== undefined
                        ? formatPrice(data.change) +
                          " (" +
                          Number(data.change_percent).toFixed(2) +
                          "%)"
                        : "—"
                    }

                </td>


                <td class="live">
                    LIVE
                </td>

            `;


        } catch (error) {

            row.innerHTML = `

                <td class="stock">
                    ${symbol}
                </td>

                <td colspan="13"
                    class="error">
                    Connection error
                </td>

                <td class="error">
                    ERROR
                </td>

            `;

        }

    }


    status.innerText =
        "Scan complete • 12 stocks checked";


    button.disabled = false;

    button.innerText =
        "🔍 Scan Stocks";

    scanning = false;

}


// --------------------------------------------------
// SEARCH
// --------------------------------------------------

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                .toUpperCase()
                .trim();


            const rows =
                document.querySelectorAll(
                    "#stockTable tr"
                );


            rows.forEach(row => {

                const stock =
                    row
                    .querySelector(".stock");

                if (!stock) {
                    return;
                }

                const symbol =
                    stock.innerText
                    .toUpperCase();


                row.style.display =
                    symbol.includes(search)
                    ? ""
                    : "none";

            });

        }
    );

</script>

</body>
</html>
